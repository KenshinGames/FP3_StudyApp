# 「AIに質問」の Worker(worker/)を Cloudflare に公開する。Mac がなくても、GitHub の上で動く。
# 必要なリポジトリの Secrets(Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  … Cloudflare の API トークン(テンプレート「Edit Cloudflare Workers」で作る)
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare のアカウント ID
# 動くとき:Actions の画面から手動で(Run workflow)/ main の worker/ が変わったとき
name: Worker を公開

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Secrets が登録されているか
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID をリポジトリの Secrets に登録してください"
            exit 1
          fi
      - run: npm ci
      - name: 型チェック
        run: npx tsc --noEmit -p .
      - name: 公開
        run: npx wrangler deploy | tee deploy.log
      - name: 動作確認(試しに 1 回質問して、答えが返るか)
        run: |
          url=$(grep -o 'https://[a-z0-9.-]*\.workers\.dev' deploy.log | head -1)
          echo "URL: $url"
          cat > smoke.json <<'JSON'
          {"problem":{"field":"タックスプランニング","question":"勤続30年・退職金2,500万円のとき、退職所得の金額はいくらか。","choices":["500万円","1,000万円","2,500万円","1,250万円"],"correct":"500万円","picked":"1,000万円","explanation":"退職所得 = (退職金 − 退職所得控除額)× 1/2 = (2,500万円 − 1,500万円)× 1/2 = 500万円"},"messages":[{"role":"user","content":"なぜ2分の1にするの?"}]}
          JSON
          out=$(curl -sS -m 90 -X POST "$url/chat" -H 'Origin: https://kenshingames.github.io' -H 'Content-Type: application/json' --data @smoke.json)
          echo "$out"
          echo "$out" | grep -q '"t":"done"' || { echo "::error::答えが最後まで返ってこなかった"; exit 1; }
