# FP3級 合格ドリルの「AIに質問」に答える Worker。
# ふだんは Cloudflare Workers AI の無料枠で答える(API キー不要・Workers Free プランなら料金なし)。
# 公開:このフォルダで `npm run deploy`。表示された URL + /chat を、リポジトリ直下の config.js の CHAT_URL に入れる。
# 手順の全体は docs/ai-chat.md
name = "fp3-chat"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# https://fp3-chat.<あなたのサブドメイン>.workers.dev で受ける。
# 独自ドメインにするなら、下の行を有効にする(api.kenshin-games.jp は別の Worker が使っているので別の名前で)
workers_dev = true
# routes = [{ pattern = "fp3-api.kenshin-games.jp", custom_domain = true }]

# Workers AI(無料枠:1 日 10,000 Neurons。日本時間の朝 9 時に戻る)
[ai]
binding = "AI"

[vars]
# 答える AI:"workers-ai"(無料枠)か "anthropic"(Claude。有料。npx wrangler secret put ANTHROPIC_API_KEY が必要)
PROVIDER = "workers-ai"
# Workers AI のモデル(日本語が得意で、無料枠の消費が少ないもの)
WORKERS_AI_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
# Claude のモデル(PROVIDER = "anthropic" のとき)。安くしたいときは "claude-haiku-5-5"
ANTHROPIC_MODEL = "claude-opus-5-5"
# 呼び出してよいページ(カンマ区切り)。ローカルで試すときは http://localhost:8000 など
ALLOWED_ORIGINS = "https://kenshingames.github.io,http://localhost:8000,http://127.0.0.1:8000"

# いたずら対策:同じ IP から 1 分に 8 回まで
[[ratelimits]]
name = "LIMITER"
namespace_id = "2001"
simple = { limit = 8, period = 60 }
